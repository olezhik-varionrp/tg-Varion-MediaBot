<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Varion Media App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
        button { width: 100%; padding: 15px; background: #2481cc; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h3>Заявка в Varion Media</h3>
    <input type="text" id="title" placeholder="Заголовок">
    <textarea id="desc" placeholder="Описание"></textarea>
    <button onclick="submitData()">Отправить</button>

    <script>
        let tg = window.Telegram.WebApp;
        function submitData() {
            let data = {
                title: document.getElementById('title').value,
                desc: document.getElementById('desc').value
            };
            tg.sendData(JSON.stringify(data)); // Отправляем данные боту
            tg.close(); // Закрываем приложение
        }
    </script>
</body>
</html>
